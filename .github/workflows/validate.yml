name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` and `topics` are required only for listing in the default
          # HACS store. This is installed as a custom repository, so they don't
          # apply — skip them. (To pursue default-store listing later: add
          # GitHub repo topics and register the domain in home-assistant/brands,
          # then drop this ignore.)
          ignore: brands topics

  tests:
    name: Scheduler unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest tests/test_scheduler.py -v
